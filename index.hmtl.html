<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitoring Unit & Status</title>
  <!-- Library PapaParse untuk membaca CSV -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 24px; }
    .container { max-width: 1100px; margin: 0 auto; }
    
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 1px solid #334155;
      padding-bottom: 16px;
    }
    h1 { font-size: 24px; color: #38bdf8; }
    .last-update { font-size: 13px; color: #94a3b8; }

    /* Counter ringkasan */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .summary-card {
      background-color: #1e293b;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .summary-title { font-size: 13px; color: #94a3b8; }
    .summary-value { font-size: 28px; font-weight: bold; margin-top: 4px; color: #38bdf8; }

    /* Grid Kartu Unit */
    .unit-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .unit-card {
      background-color: #1e293b;
      border-radius: 8px;
      padding: 18px;
      border-left: 5px solid #22c55e; /* Default Hijau (Active) */
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .unit-card.inactive {
      border-left-color: #ef4444; /* Merah jika tidak Active */
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .unit-code { font-size: 18px; font-weight: bold; color: #f1f5f9; }
    .customer-name { font-size: 12px; color: #38bdf8; font-weight: 600; margin-top: 2px; }

    .badge {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .badge.active { background-color: rgba(34, 197, 94, 0.2); color: #4ade80; }
    .badge.inactive { background-color: rgba(239, 68, 68, 0.2); color: #f87171; }

    .details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 12px;
      font-size: 13px;
      margin-top: 8px;
      padding-top: 10px;
      border-top: 1px dashed #334155;
    }

    .detail-item { display: flex; flex-direction: column; }
    .detail-label { color: #64748b; font-size: 11px; }
    .detail-value { color: #cbd5e1; font-weight: 500; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>Fleet Unit Status Monitoring</h1>
        <div class="last-update" id="last-update">Memuat data...</div>
      </div>
    </header>

    <!-- Ringkasan Singkat -->
    <div class="summary-grid">
      <div class="summary-card">
        <div class="summary-title">Total Unit</div>
        <div class="summary-value" id="total-units">0</div>
      </div>
      <div class="summary-card">
        <div class="summary-title">Unit Active</div>
        <div class="summary-value" style="color: #4ade80;" id="active-units">0</div>
      </div>
    </div>

    <!-- Container Utama -->
    <div class="unit-grid" id="unit-container">
      <!-- Data dari file Excel/Sheets akan dimasukkan secara otomatis ke sini -->
    </div>
  </div>

  <script>
    // MASUKKAN URL CSV GOOGLE SHEETS ANDA DI SINI
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQxZJ2QiL0U_vsWTWx8iMtLS2sJ5YjKC4w-xmjoPcnRpaBNiScSf74Hv5GI4JUIxos9FfUJ6Nz4wDvv/pub?output=csv';

    function loadMonitoringData() {
      Papa.parse(CSV_URL, {
        download: true,
        header: true,
        complete: function(results) {
          const data = results.data;
          const container = document.getElementById('unit-container');
          container.innerHTML = '';

          let totalCount = 0;
          let activeCount = 0;

          data.forEach(row => {
            // Abaikan baris kosong jika ada
            if (!row['Unit Code']) return;

            totalCount++;
            const isActive = row['Status'] && row['Status'].trim().toLowerCase() === 'active';
            if (isActive) activeCount++;

            const statusClass = isActive ? 'active' : 'inactive';
            const statusLabel = isActive ? 'ACTIVE' : (row['Status'] || 'INACTIVE');

            // Bulatkan Left Days & Active Day jika ada angka desimal
            const leftDays = row['Left days'] ? Math.round(parseFloat(row['Left days'])) : '-';
            const activeDays = row['Active Day'] ? Math.round(parseFloat(row['Active Day'])) : '-';

            const card = document.createElement('div');
            card.className = `unit-card ${statusClass}`;
            card.innerHTML = `
              <div>
                <div class="card-header">
                  <div>
                    <div class="unit-code">${row['Unit Code']}</div>
                    <div class="customer-name">${row['Customer'] || '-'} (${row['Site'] || '-'})</div>
                  </div>
                  <span class="badge ${statusClass}">${statusLabel}</span>
                </div>
                
                <div style="font-size: 13px; color: #94a3b8; margin-bottom: 8px;">
                  Truck: <strong>${row['Truck Type'] || '-'}</strong> | Chassis: <strong>${row['Chassis ID'] || '-'}</strong>
                </div>
              </div>

              <div class="details-grid">
                <div class="detail-item">
                  <span class="detail-label">Active Days</span>
                  <span class="detail-value">${activeDays} Hari</span>
                </div>
                <div class="detail-item">
                  <span class="detail-label">Left Days</span>
                  <span class="detail-value">${leftDays} Hari</span>
                </div>
                <div class="detail-item">
                  <span class="detail-label">Start Date</span>
                  <span class="detail-value">${row['Start date'] || '-'}</span>
                </div>
                <div class="detail-item">
                  <span class="detail-label">Contract Period</span>
                  <span class="detail-value">${row['Contract Period'] || '-'}</span>
                </div>
              </div>
            `;

            container.appendChild(card);
          });

          // Update Counter Ringkasan
          document.getElementById('total-units').innerText = totalCount;
          document.getElementById('active-units').innerText = activeCount;
          document.getElementById('last-update').innerText = 'Pembaruan Terakhir: ' + new Date().toLocaleTimeString();
        }
      });
    }

    // Panggil fungsi saat halaman pertama kali dibuka
    loadMonitoringData();

    // Otomatis perbarui tampilan setiap 60 detik
    setInterval(loadMonitoringData, 60000);
  </script>
</body>
</html>
